apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kustomize-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sriramg-aivar/gitops-lab.git
    targetRevision: HEAD
    path: kustomize-app/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: kz-prod
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
