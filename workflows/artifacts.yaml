apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: artifacts-
spec:
  entrypoint: main
  templates:
    - name: main
      steps:
        - - name: generate
            template: gen-file
        - - name: consume
            template: print-file
            arguments:
              artifacts:
                - name: msg
                  from: "{{steps.generate.outputs.artifacts.out}}"
    - name: gen-file
      container:
        image: alpine:3.19
        command: [sh, -c]
        args: ["echo hello artifact > /tmp/hello.txt"]
      outputs:
        artifacts:
          - name: out
            path: /tmp/hello.txt
    - name: print-file
      inputs:
        artifacts:
          - name: msg
            path: /tmp/in.txt
      container:
        image: alpine:3.19
        command: [sh, -c]
        args: ["cat /tmp/in.txt"]
