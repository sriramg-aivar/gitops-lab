apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: uses-template-
spec:
  entrypoint: main
  templates:
    - name: main
      steps:
        - - name: call
            templateRef:
              name: shared-steps
              template: greet
            arguments:
              parameters: [{name: name, value: Sriram}]
