apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: shared-steps
spec:
  entrypoint: greet
  arguments:
    parameters:
      - name: name
        value: team
  templates:
    - name: greet
      inputs:
        parameters:
          - name: name
      container:
        image: alpine:3.19
        command: [echo, "hello {{inputs.parameters.name}} from a shared template"]
