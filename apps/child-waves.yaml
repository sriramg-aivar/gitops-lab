apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: child-waves
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sriramg-aivar/gitops-lab.git
    targetRevision: HEAD
    path: waves
  destination:
    server: https://kubernetes.default.svc
    namespace: child-waves
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
